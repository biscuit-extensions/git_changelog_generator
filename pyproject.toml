[tool.poetry]
name = "git_changelog_generator"
version = "0.1.0"
description = "Generate clean release changelogs from git commit logs"
authors = ["billyeatcookies"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
biscuit-editor = "^3.0.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.5"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
